services:
  - type: web
    name: student-placement-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -c "from backend.app.database import engine, Base; import backend.app.models; Base.metadata.create_all(bind=engine)"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: log
