<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:5173/">
  <title>Open Student Placement Analyzer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 440px;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
    }
    a.btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.75rem;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Student Placement Analyzer</h2>
    <p>Redirecting to local application URL...</p>
    <a class="btn" href="http://localhost:5173/">Launch http://localhost:5173</a>

</html>
